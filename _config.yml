### Markdown ###
kramdown:
  # Don't auto-generate heading ids from heading text - our <section id="...">
  # wrappers already provide stable anchors, and auto ids would collide with
  # them whenever a heading's text happens to match a section's id (e.g. a
  # heading literally titled "About" on the section with id="about"). This
  # also means content editors can freely reword headings without worrying
  # about breaking any anchor links.
  auto_ids: false


### Site Settings ###
title               : NUOMI Lab @ LSBU
description         : The Normative and User-Oriented Machine Intelligence (NUOMI) Lab is an Artificial Intelligence research group at London South Bank University
baseurl             : ""                                # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
repository          : nuomi-lab/nuomi-lab.github.io
remote_theme        : YoussefRaafatNasry/portfolYOU
open_new_tab        : true                              # Opens external URLs in new tab (works for posts, projects and navbar only)
keywords            : Machine Learning, ML, Artificial Intelligence, AI, Normative Machine Learning, Human-Centred AI, Human-AI Interaction, Interpretability, Uncertainty, AI Ethics, Research, London South Bank University, LSBU, Computer Science

# Lab logo shown in the masthead. Leave commented out for a text-only masthead.
# logo                : /assets/img/nuomi-lab-logo.png

# Show the Publications section and nav tab. Hidden until the lab has its own
# papers in _bibliography/selected_publications.md.
show_publications   : false

# Jekyll Sitemap
url: "https://nuomi-lab.github.io"

# Jekyll WebP
webp:
  enabled: true
  
  # The quality of the webp conversion 0 to 100 (where 100 is least lossy)
  quality: 75

  # List of directories containing images to optimize, nested directories will only be checked if `nested` is true
  # By default the generator will search for a folder called `/img` under the site root and process all jpg, png and tiff image files found there.
  img_dir: ["/assets/img", "/assets/img/people"]

  # Whether to search in nested directories or not
  nested: true

  # add ".gif" to the format list to generate webp for animated gifs as well
  formats: [".jpeg", ".jpg", ".png", ".tiff"]

  # File extensions for animated gif files 
  gifs: [".gif"]

  # Set to true to always regenerate existing webp files
  regenerate: false

  # Local path to the WebP utilities to use (relative or absolute)
  # Omit or leave as nil to use the utilities shipped with the gem, override only to use your local install
  # Eg : "/usr/local/bin/cwebp"
  webp_path: nil

  # List of files or directories to exclude
  # e.g. custom or hand generated webp conversion files
  exclude: []

  # append '.webp' to filename after original extension rather than replacing it.
  # Default transforms `image.png` to `image.webp`, while changing to true transforms `image.png` to `image.png.webp`
  append_ext: false


