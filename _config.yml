### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - CONTENT-GUIDE.md
  - LICENSE
  - Makefile
  - "*.log"


### Jekyll Scholar ###
scholar:
  style: apa
  locale: en

  # Used by _layouts/bib.html to bold/italicize your own name in author lists.
  first_name: Weiwei
  last_name: Pan

  source: /_bibliography/
  bibliography: selected_publications.md
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  # Group entries by year (descending) so the page doesn't depend on a
  # hardcoded list of years - _bibliography/selected_publications.md is
  # hand-maintained (see its header comment and CONTENT-GUIDE.md), so years
  # shouldn't need to be kept in sync by hand.
  # Note: jekyll-scholar applies bibliography_class to BOTH the group
  # heading (<h2>) and the entry list (<ol>) - do not override it, since
  # _publications.scss's list styling (badges, abstract/bibtex collapse,
  # link buttons) is scoped to the default `ol.bibliography`. The group
  # heading is instead targeted in CSS as `h2.bibliography`.
  group_by: year
  group_order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"


